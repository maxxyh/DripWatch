# Local Supabase CLI configuration (`supabase start`). Safe to commit: no secrets, only
# `env(...)` references. For the full reference, see:
# https://supabase.com/docs/guides/local-development/cli/config
#
# `[edge_runtime]` and `[analytics]` are disabled below because this project has no Edge
# Functions and doesn't use Studio's log explorer locally — this keeps `supabase start` faster
# and lighter. Re-enable either if that changes.
project_id = "dripwatch"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Must match the hosted project's Postgres version (`SHOW server_version;` on remote, or
# `database.version` from the Management API).
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
# The declarative schema is the source of truth; migrations/ holds the generated diff that
# `supabase start` / `db reset` actually apply. Regenerate after editing schemas/dripwatch.sql:
#   supabase db diff -f <descriptive_name>
schema_paths = ["./schemas/dripwatch.sql"]

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

# Emails sent locally aren't delivered — this catches them for inspection instead.
# Not used by DripWatch today (no Supabase Auth email flows), left on for parity with prod.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"
# The bean-photos and brew-photos buckets themselves are created by schemas/dripwatch.sql
# (`insert into storage.buckets ...`); the [storage.buckets.*] sections below only seed sample
# objects into them from ./seed/, they don't redeclare the buckets. `supabase start` picks these
# up automatically; after editing files under seed/, re-apply with `supabase seed buckets --local`.
[storage.buckets.bean-photos]
public = false
objects_path = "./seed/bean-photos"

[storage.buckets.brew-photos]
public = false
objects_path = "./seed/brew-photos"

[storage.s3_protocol]
enabled = true

[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 5

# DripWatch has no per-user Supabase Auth (see supabase/README.md — every anon client shares
# one notebook), so most of this section is inert. Left enabled and at defaults so the anon/
# authenticated Postgres roles the RLS policies grant to are provisioned like on the hosted
# project.
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[auth.third_party.clerk]
enabled = false

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

# No Edge Functions in this project (no supabase/functions/ directory).
[edge_runtime]
enabled = false
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Not used locally — Studio's log explorer / analytics backend, disabled to keep `supabase
# start` lighter. Re-enable if you need to inspect logs through Studio.
[analytics]
enabled = false
port = 54327
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"

[experimental.pgdelta]
enabled = true
